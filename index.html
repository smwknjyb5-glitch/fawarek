  [280,310,330].forEach(x=>rect(c,x,215,14,25,'#9aa5b5'));
  rect(c,360,120,10,100,'#8b5a2b');circ(c,365,100,35,'#2e9b46');
  if(!m.has(4)){circ(c,350,112,9,'#8b5a2b');circ(c,347,110,2,'#000');line(c,352,121,352,134,'#8b5a2b',3)}
  if(!m.has(5)){circ(c,196,100,6,'#ff4fa0');circ(c,206,100,6,'#ff4fa0');circ(c,201,100,2,'#222')}
  rect(c,178,225,4,30,'#6b3e1a');rect(c,150,205,60,25,m.has(3)?'#3b6fd4':'#b8863f');line(c,160,217,200,217,'#fff',3);
  for(let i=0;i<14;i++){if(!(m.has(6)&&i==5))rect(c,20+i*25,252,8,32,'#d9a566')}
  rect(c,15,262,350,5,'#b8863f');
  flower(c,30,232,m.has(8)?'#ffd400':'#e5484d');
}
/* ---- 10: الملعب ---- */
function pitch(c,m){
  sky(c,'#8fd3ff','#e6f7ff');
  if(!m.has(8))cloud(c,60,35);
  rect(c,0,60,W,60,'#8a8f99');for(let i=0;i<40;i++)circ(c,5+i*10,75+(i%3)*14,3.5,['#e5484d','#ffd400','#fff','#3b6fd4'][i%4]);
  rect(c,85,80,30,18,m.has(5)?'#22a559':'#e5484d');
  rect(c,0,120,W,180,'#3a9d3a');for(let i=0;i<6;i++)rect(c,i*70,120,35,180,'#348f34');
  c.strokeStyle='#fff';c.lineWidth=2;c.strokeRect(30,140,340,140);line(c,200,140,200,280,'#fff',2);c.beginPath();c.arc(200,210,30,0,7);c.stroke();
  c.strokeRect(30,185,18,50);c.strokeRect(352,185,18,50);
  rect(c,160,20,80,30,'#111');c.fillStyle='#ffd400';c.font='bold 18px monospace';c.textAlign='center';c.fillText(m.has(0)?'2 - 3':'2 - 1',200,42);
  if(!m.has(1)){circ(c,200,210,8,'#fff');circ(c,200,210,3,'#222')}
  kid(c,120,205,m.has(2)?'#3b6fd4':'#e5484d');
  if(!m.has(3))kid(c,280,230,'#3b6fd4');
  line(c,30,140,30,122,'#fff',2);poly(c,m.has(4)?'#e5484d':'#ffd400',[[30,122],[44,127],[30,132]]);
  if(!m.has(7))kid(c,360,215,'#22a559');
  if(!m.has(6)){rect(c,372,40,4,60,'#555');rect(c,362,25,24,16,'#fff7c2')}
}
const SCENES=[
 {d:village,p:[[330,55],[110,60],[145,105],[145,215],[100,175],[200,112],[325,155],[260,245],[200,40]]},
 {d:beach,p:[[60,55],[215,128],[300,165],[352,142],[120,260],[250,45],[60,270],[230,255],[150,68]]},
 {d:space,p:[[100,100],[322,55],[200,160],[310,200],[50,230],[150,40],[60,180],[200,218],[260,110]]},
 {d:city,p:[[340,50],[70,215],[165,62],[281,105],[128,265],[320,236],[366,235],[163,136],[230,45]]},
 {d:farm,p:[[50,50],[232,180],[105,245],[80,203],[330,258],[380,155],[150,58],[180,225],[270,68]]},
 {d:sea,p:[[100,60],[200,60],[50,240],[310,110],[80,275],[230,280],[220,165],[360,250],[60,40]]},
 {d:camp,p:[[340,45],[110,98],[110,240],[230,245],[320,215],[200,40],[278,84],[60,60],[370,272]]},
 {d:school,p:[[50,50],[212,67],[200,150],[162,142],[50,260],[350,200],[320,265],[300,50],[130,247]]},
 {d:zoo,p:[[350,45],[83,150],[248,198],[180,215],[352,110],[201,100],[150,262],[230,50],[30,237]]},
 {d:pitch,p:[[200,35],[200,210],[120,205],[280,225],[32,128],[100,88],[372,60],[360,210],[60,35]]}
];

function overlay(c){
  found.forEach(i=>{c.strokeStyle='#22a559';c.lineWidth=4;c.beginPath();c.arc(POS[i][0],POS[i][1],26,0,7);c.stroke()});
  if(hintIdx!==null&&!found.includes(hintIdx)){c.strokeStyle='#ffb300';c.setLineDash([6,5]);c.lineWidth=3;c.beginPath();c.arc(POS[hintIdx][0],POS[hintIdx][1],30,0,7);c.stroke();c.setLineDash([])}
}
function render(){
  const s=SCENES[cur];s.d(x1,new Set());s.d(x2,new Set(diffs));overlay(x1);overlay(x2);
  document.getElementById('found').textContent=found.length;
  document.getElementById('err').textContent=errs;
}
function say(t,col){const m=document.getElementById('msg');m.textContent=t;m.style.color=col||''}
function start(){
  const v=document.getElementById('sc').value;
  cur=v==='r'?Math.floor(Math.random()*SCENES.length):+v;
  POS=SCENES[cur].p;
  diffs=[...POS.keys()].sort(()=>Math.random()-.5).slice(0,5);
  found=[];errs=0;done=false;hintIdx=null;t0=Date.now();
  clearInterval(timer);
  timer=setInterval(()=>{if(!done)document.getElementById('time').textContent=Math.floor((Date.now()-t0)/1000)},500);
  document.getElementById('time').textContent=0;
  say('اضغط على المكان المختلف في أي من الصورتين');
  render();
}
function click(e){
  if(done)return;
  const r=e.currentTarget.getBoundingClientRect();
  const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  const hit=diffs.find(i=>!found.includes(i)&&Math.hypot(POS[i][0]-x,POS[i][1]-y)<32);
  if(hit!==undefined){
    found.push(hit);hintIdx=null;
    if(found.length===5){done=true;say('🎉 أحسنت! وجدت كل الاختلافات في '+Math.floor((Date.now()-t0)/1000)+' ثانية وبـ '+errs+' أخطاء','var(--ok)')}
    else say('✔ ممتاز! بقي '+(5-found.length),'var(--ok)');
  }else{errs++;say('✘ ليس هنا، حاول مرة أخرى','var(--bad)')}
  render();
}
c1.addEventListener('click',click);c2.addEventListener('click',click);
document.getElementById('hint').onclick=()=>{
  if(done)return;
  hintIdx=diffs.filter(i=>!found.includes(i))[0];errs++;render();say('💡 انظر إلى الدائرة المتقطعة (+1 خطأ)');
};
document.getElementById('again').onclick=start;
document.getElementById('sc').onchange=start;
start();
</script>
